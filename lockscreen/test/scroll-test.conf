# Minimal headless scroll for the locker e2e. Lab only.
output HEADLESS-1 resolution 1280x720
# wtype (virtual keyboard) and grim (screencopy) drive the test as plain clients,
# so this instance gives privileged protocols to every client. The default
# (`spawned`) is checked on a second instance (scroll-test-default.conf).
privileged_clients all
# The real lock path: scroll-lock -> SIGUSR1 -> lock_command, started by scroll.
lock_command /hutest/bin/hardened-unlock -f 2>>/hutest/work/locker.log
