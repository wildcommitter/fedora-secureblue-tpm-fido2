# Headless scroll for the duress e2e. Lab only.
output HEADLESS-1 resolution 1280x720
# wtype and grim drive the test as plain clients.
privileged_clients all
# The real lock path (scroll-lock -> SIGUSR1 -> lock_command), with the
# duresstest build of the locker: its "reset" writes the marker file.
lock_command env HARDENED_UNLOCK_DURESS_MARKER=/hutest/work/duress-marker /hutest/bin/hardened-unlock -f 2>>/hutest/work/locker.log
