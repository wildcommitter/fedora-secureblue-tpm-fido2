# hardened-unlock: lock with Mod+Alt+L, after 5 minutes idle, and before
# suspend. Read by the `include /etc/scroll/config.d/*` at the end of
# /etc/scroll/config, so $mod is already set.
#
# Only clients that scroll starts itself may use the session-lock protocol
# (`privileged_clients spawned`, the default in our fork). So scroll starts the
# locker: `lock`, or SIGUSR1 from scroll-lock, runs lock_command as a privileged
# client. A locker started any other way gets no session-lock global.
#
# scroll-lock returns once the session is locked: swayidle -w then lets the
# machine suspend only after the lock is in place, without waiting for the unlock.
#
# No idle lock in the headless VNC session (scroll-headless exports
# SCROLL_SECURE_HEADLESS=1): a remote user can't touch the key to unlock it.
lock_command hardened-unlock -f
bindsym $mod+Alt+l lock
exec sh -c '[ -n "$SCROLL_SECURE_HEADLESS" ] || exec swayidle -w timeout 300 scroll-lock before-sleep scroll-lock'
