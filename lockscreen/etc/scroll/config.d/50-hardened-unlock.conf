# hardened-unlock: lock with Mod+Alt+L, after 5 minutes idle, and before
# suspend. Read by the `include /etc/scroll/config.d/*` at the end of
# /etc/scroll/config, so $mod is already set.
#
# -f returns once the session is locked: swayidle -w then lets the machine
# suspend only after the lock is in place, without waiting for the unlock.
bindsym $mod+Alt+l exec hardened-unlock -f
exec swayidle -w \
    timeout 300 'hardened-unlock -f' \
    before-sleep 'hardened-unlock -f'
