# tokenvault: /etc/tokenvault holds the plaintext token PINs (tokenvault.conf,
# root 0600, enforced by the CLI) and the non-secret enrollment state.
# "Z" restores the SELinux label (tokenvault_conf_t, see
# /usr/share/selinux/packages/tokenvault/tokenvault.cil) without touching
# modes or owners.
d /etc/tokenvault 0700 root root -
Z /etc/tokenvault - - - -
