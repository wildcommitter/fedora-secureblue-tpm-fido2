# Headless session config (see /usr/libexec/scroll-headless).
include /etc/scroll/config

output HEADLESS-1 resolution 2560x1440 position 0 0

# Loopback only: reach it with `ssh -L 5900:127.0.0.1:5900 host`.
# Started from here so wayvnc inherits this compositor's WAYLAND_DISPLAY.
exec /usr/bin/wayvnc 127.0.0.1 5900
