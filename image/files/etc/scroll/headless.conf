# Headless session config (see /usr/libexec/scroll-headless).
include /etc/scroll/config

output HEADLESS-1 resolution 2560x1440 position 0 0

# wayvnc listens on a Unix socket in the user's runtime dir (mode 0700), not on
# TCP: loopback TCP is open to every local user and every process with network
# access, and wayvnc has no auth configured. Reach it over SSH:
#   ssh -L 5900:/run/user/<uid>/wayvnc.sock host   then a VNC viewer to localhost:5900
# exec_privileged: wayvnc needs screencopy and virtual keyboard/pointer, which our
# scroll gives only to clients it starts itself. sh -c expands $XDG_RUNTIME_DIR.
exec_privileged /usr/bin/wayvnc --unix-socket "$XDG_RUNTIME_DIR/wayvnc.sock"
