# Desktop: a key-binding cheatsheet on black, and a terminal at login.
#
# The wallpaper is drawn at image build by keys-wallpaper.py from the final
# config, which fails the build if a key on the sheet isn't bound. scroll starts
# swaybg itself, so swaybg keeps layer-shell. `fit` scales the sheet to the screen;
# the rest of the screen is black.
output * bg /usr/share/scroll-secure/keys.png fit #000000
exec $term
