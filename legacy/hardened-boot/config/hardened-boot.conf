# Hardened Boot MFA configuration.
# This file is copied to /etc/hardened-boot/hardened-boot.conf by enroll.sh
# and is also bundled into the initramfs (same path) so the boot-time agent
# reads identical values. Machine-specific — regenerate if you reinstall or
# repartition.

# Directory holding all non-secret enrollment metadata (salt, FIDO2
# credential id, TPM2-sealed blob, config). Nothing under this directory is
# sufficient by itself to derive the unlock key: the FIDO2 secret requires
# the physical token, the TPM2 secret requires this exact TPM chip, and
# both passwords are never stored anywhere.
HB_DIR=/etc/hardened-boot

# Root LUKS2 device, addressed by UUID for stability.
LUKS_UUID=c077878a-836c-4414-8a17-55ad9ab1d401
LUKS_DEVICE=/dev/disk/by-uuid/c077878a-836c-4414-8a17-55ad9ab1d401

# FIDO2 relying-party id used for the local (non-web) credential. Arbitrary
# but must stay consistent between enrollment and boot-time assertion.
FIDO2_RPID=hardened-boot.local

# TPM2 PCRs the sealed secret is bound to. PCR 7 = Secure Boot policy state.
# Secure Boot is disabled on this machine, which makes PCR 7 stable across
# kernel/initramfs updates (unlike PCR 4/8/9, which would change on every
# kernel update and cause spurious lockouts). If Secure Boot is enabled
# later, or the boot chain measurement changes, this seal must be redone
# (see rotate.sh).
TPM2_PCRS=7

# Context string bound into the HKDF derivation (domain separation).
HKDF_INFO=hardened-boot-luks-v1

# Seconds the initramfs agent will keep retrying the full factor-collection
# sequence before giving up and letting boot continue to the standard
# ask-password prompt (which still works against the fallback keyslot).
UNLOCK_TIMEOUT=180

# Seconds the agent waits, on each ask-password attempt, for the operator to
# type "skip" and fall back to the plain-password unlock instead of MFA.
SKIP_WINDOW=10
