# Headless scroll for vmgui-wire-e2e.sh. Lab only.
output HEADLESS-1 resolution 1280x720
# grim, wtype and wlrctl check the frame and drive input as plain clients. VM
# windows are sandboxed clients, so they still get no privileged protocol.
privileged_clients all
default_border pixel 2
# What `vmgui add --os win11 win 1 '#ff00ff'` writes, with a log (CID 1 is vsock
# loopback: the "guest" is vmgui-agent's demo backend in this container).
exec_privileged /usr/libexec/vmgui/vmgui-host win 2>>/vgtest/work/host-win.log
for_window [sandbox_engine="^scroll-vm$" sandbox_app_id="^win$"] border_color #ff00ff, title_format "[win] %title", border normal 3
