# Headless scroll for vmgui-e2e.sh. Lab only.
output HEADLESS-1 resolution 1280x720
# grim (screencopy) checks the frame as a plain client. VM windows are sandboxed
# clients, so they get no privileged protocol even with `all`, and the scroll-vm
# engine stays reserved to privileged clients.
privileged_clients all
default_border pixel 2
# What `vmgui add lab 1 '#ff00ff'` and `vmgui add other 5 '#00ff00'` write, with
# logs (CID 1 is vsock loopback: the "guest" is a process in this container).
exec_privileged /usr/libexec/vmgui/vmgui-host lab 2>>/vgtest/work/host-lab.log
for_window [sandbox_engine="^scroll-vm$" sandbox_app_id="^lab$"] border_color #ff00ff, title_format "[lab] %title", border normal 3
exec_privileged /usr/libexec/vmgui/vmgui-host other 2>>/vgtest/work/host-other.log
for_window [sandbox_engine="^scroll-vm$" sandbox_app_id="^other$"] border_color #00ff00, title_format "[other] %title", border normal 3
