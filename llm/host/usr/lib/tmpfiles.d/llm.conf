# llm state (llm/README.md). Models are root-owned and group-readable by llm: the
# server reads them, only root (`llm import`, llmctl-host) adds or selects one.
d /var/lib/llm 0750 root llm -
d /var/lib/llm/models 0750 root llm -
# The server's socket; systemd-socket-proxyd (group llm) connects to it.
d /run/llm 0750 llm llm -
