# Build in stages, sign and publish: the desktop RPMs, the vmgui guest packages,
# the sealed scroll-secure image and its installer ISO, then one release with all
# of them.
#
#   lint     repro-lint (P1-P11) and its mutation test
#   rpms     desktop/build.sh: scroll + scroll-secure-desktop, built by mock
#   guest    vmgui/guest/build.sh: guest RPMs/DEBs (wlroots|xorg), win11/macos agents
#   image    image/build.sh: the sealed image (signing keys), push + cosign; checks that
#            the RPMs inside it are byte-identical to the ones `rpms` publishes
#   llm      llm/build.sh: the llm-server image, push + cosign (needs COSIGN_KEY)
#   iso      image/iso/build-iso.sh for the pushed image
#   publish  a GitHub release: all RPMs, guest packages, the ISO, SHA256SUMS
#
# The image never consumes an artifact of this workflow: it builds its RPMs from
# source in its own rpm-build stage (image/Containerfile). The `image` job only
# compares them with the `rpms` artifact, which works because the build is
# reproducible (image/REPRODUCIBLE.md).
#
# Whoever runs this signs the result. This repo signs with the project keys;
# a fork signs with its own (see image/README.md, "Your own signed build").
# `image` only builds when the `signing` environment has these secrets:
#   SB_DB_KEY        Secure Boot db private key (PEM)       -> signs systemd-boot, UKI, addons
#   SB_PCR_KEY       PCR 11 policy private key (PEM)        -> signs the TPM policy
#   COSIGN_KEY       cosign private key                     -> signs the container image
#   COSIGN_PASSWORD  its password
# and the matching public material is committed: image/uki/keys/, image/cosign.pub.
# Without them, the RPMs and guest packages are still built and published.
#
# Pull requests run lint, rpms and guest only (no secrets, nothing published).

name: build

permissions: {}

on:
  push:
    branches: [main]
    paths: ["image/**", "desktop/**", "lockscreen/**", "vmgui/**", "vmswitch/**", "llm/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["image/**", "desktop/**", "lockscreen/**", "vmgui/**", "vmswitch/**", "llm/**", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # mock (stage rpm-build) unshares namespaces and mounts in its chroot. The build
  # passes --cap-add=SYS_ADMIN; the runner's AppArmor profile for containers would
  # still deny mount, so builds here run unconfined by AppArmor (CI only).
  CONTAINERS_CONF_OVERRIDE: ${{ github.workspace }}/../containers-ci.conf

jobs:
  lint:
    name: Reproducibility premises
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: repro-lint and its mutation test
        run: |
          set -euo pipefail
          python3 -I image/repro-lint.py
          image/repro-lint-test.sh

  rpms:
    name: Desktop RPMs (mock)
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out (full history for SOURCE_DATE_EPOCH)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Let mock mount inside builds
        run: printf '[containers]\napparmor_profile = "unconfined"\n' > "${CONTAINERS_CONF_OVERRIDE}"
      - name: Build
        run: desktop/build.sh
      - name: Checksums
        run: |
          set -euo pipefail
          cd desktop/out
          sha256sum -- *.rpm > SHA256SUMS.rpms
          cat SHA256SUMS.rpms >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-rpms
          path: |
            desktop/out/*.rpm
            desktop/out/SHA256SUMS.rpms
          if-no-files-found: error

  guest:
    name: vmgui guest packages
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out (full history for SOURCE_DATE_EPOCH)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build every target
        run: vmgui/guest/build.sh
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/guest"
          find vmgui/guest/out -type f \( -name '*.rpm' -o -name '*.deb' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp -t "${RUNNER_TEMP}/guest" {} +
          cd "${RUNNER_TEMP}/guest"
          sha256sum -- * > SHA256SUMS.guest
          cat SHA256SUMS.guest >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-packages
          path: ${{ runner.temp }}/guest/*
          if-no-files-found: error

  llm:
    name: llm-server image
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    environment: signing
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check for the cosign key
        id: keys
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          if [[ -n "${COSIGN_KEY}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::No COSIGN_KEY in the 'signing' environment; llm-server is not built."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Check out (full history for SOURCE_DATE_EPOCH)
        if: steps.keys.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install cosign
        if: steps.keys.outputs.present == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: "v2.6.0"
      - name: Build, push and sign
        if: steps.keys.outputs.present == 'true'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          repo="ghcr.io/${owner}/scroll-secure-llm"
          llm/build.sh "${repo}:latest"
          printenv GH_TOKEN | podman login ghcr.io -u "${ACTOR}" --password-stdin
          tag="$(date -u +%Y%m%d)"
          podman tag "${repo}:latest" "${repo}:${tag}"
          podman push --digestfile "${RUNNER_TEMP}/digest" "${repo}:latest"
          podman push "${repo}:${tag}"
          digest="$(cat "${RUNNER_TEMP}/digest")"
          printenv GH_TOKEN | cosign login ghcr.io -u "${ACTOR}" --password-stdin
          cosign sign -y --key env://COSIGN_KEY "${repo}@${digest}"
          cosign verify --key image/cosign.pub "${repo}@${digest}" > /dev/null
          echo "Pushed and signed ${repo}@${digest} (tags latest, ${tag})" >> "${GITHUB_STEP_SUMMARY}"

  image:
    name: Build and sign the sealed image
    needs: rpms
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    environment: signing
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check for signing keys
        id: keys
        env:
          SB_DB_KEY: ${{ secrets.SB_DB_KEY }}
          SB_PCR_KEY: ${{ secrets.SB_PCR_KEY }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          if [[ -n "${SB_DB_KEY}" && -n "${SB_PCR_KEY}" && -n "${COSIGN_KEY}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::No signing secrets in the 'signing' environment; no image. RPMs and guest packages are still published. See image/README.md."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.keys.outputs.present == 'true'
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "64G"

      - name: Check out (full history for SOURCE_DATE_EPOCH)
        if: steps.keys.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Let mock mount inside builds
        if: steps.keys.outputs.present == 'true'
        run: printf '[containers]\napparmor_profile = "unconfined"\n' > "${CONTAINERS_CONF_OVERRIDE}"

      - name: Install cosign
        if: steps.keys.outputs.present == 'true'
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: "v2.6.0"

      - name: Build (signs systemd-boot, UKI, addons, PCR policy)
        if: steps.keys.outputs.present == 'true'
        env:
          SB_DB_KEY: ${{ secrets.SB_DB_KEY }}
          SB_PCR_KEY: ${{ secrets.SB_PCR_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          keys="${RUNNER_TEMP}/keys"
          install -d -m 700 "${keys}"
          trap 'rm -rf "${keys}"' EXIT
          printenv SB_DB_KEY > "${keys}/db.key"
          printenv SB_PCR_KEY > "${keys}/PCR.key"
          # The committed public keys must match the secrets, or every boot fails.
          [[ "$(openssl pkey -in "${keys}/db.key" -pubout)" == "$(openssl x509 -in image/uki/keys/db/db.pem -noout -pubkey)" ]] \
            || { echo "::error::SB_DB_KEY does not match image/uki/keys/db/db.pem"; exit 1; }
          [[ "$(openssl pkey -in "${keys}/PCR.key" -pubout)" == "$(cat image/uki/keys/PCR/PCR.pem)" ]] \
            || { echo "::error::SB_PCR_KEY does not match image/uki/keys/PCR/PCR.pem"; exit 1; }
          owner="${OWNER,,}"
          SECRETS_DIR="${keys}" image/build.sh "ghcr.io/${owner}/scroll-secure:uki"

      - name: Download the published RPMs
        if: steps.keys.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-rpms
          path: ${{ runner.temp }}/published-rpms

      - name: The image's RPMs are the published ones
        if: steps.keys.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Same inputs as the rootfs build just used: rpm-build comes from the layer
          # cache, so this exports the RPMs the image installed.
          desktop/build.sh
          cd desktop/out
          sha256sum -c "${RUNNER_TEMP}/published-rpms/SHA256SUMS.rpms"

      - name: Push and sign
        id: push
        if: steps.keys.outputs.present == 'true'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          repo="ghcr.io/${owner}/scroll-secure"
          printenv GH_TOKEN | podman login ghcr.io -u "${ACTOR}" --password-stdin
          tag="$(date -u +%Y%m%d)-uki"
          podman tag "${repo}:uki" "${repo}:${tag}"
          podman push --digestfile "${RUNNER_TEMP}/digest" "${repo}:uki"
          podman push "${repo}:${tag}"
          digest="$(cat "${RUNNER_TEMP}/digest")"
          printenv GH_TOKEN | cosign login ghcr.io -u "${ACTOR}" --password-stdin
          cosign sign -y --key env://COSIGN_KEY "${repo}@${digest}"
          cosign verify --key image/cosign.pub "${repo}@${digest}" > /dev/null
          echo "ref=${repo}:uki" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed and signed ${repo}@${digest} (tags uki, ${tag})" >> "${GITHUB_STEP_SUMMARY}"

  iso:
    name: Build the installer ISO
    needs: image
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ISO
        env:
          REF: ${{ needs.image.outputs.ref }}
        run: image/iso/build-iso.sh "${REF}" "${RUNNER_TEMP}/iso"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso
          path: ${{ runner.temp }}/iso/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [rpms, guest, image, iso]
    # Also without signing secrets (no image, no ISO): the RPMs and guest packages.
    if: >-
      always() && github.event_name != 'pull_request'
      && needs.rpms.result == 'success' && needs.guest.result == 'success'
      && needs.image.result == 'success' && needs.iso.result != 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download everything
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/dl

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ needs.image.outputs.ref }}
          DIGEST: ${{ needs.image.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release"
          mkdir -p "${out}"
          find "${RUNNER_TEMP}/dl" -type f ! -name 'SHA256SUMS*' ! -name '*.sha256' -exec cp -t "${out}" {} +
          # One checksum file for every asset; the ISO keeps its own .sha256 too.
          find "${RUNNER_TEMP}/dl" -type f -name '*.sha256' -exec cp -t "${out}" {} +
          # GitHub renames assets with other characters (scroll's 1.13~dev), which would
          # break SHA256SUMS: name them as GitHub would serve them first.
          cd "${out}"
          for f in *; do
            n="$(printf '%s' "${f}" | tr -c 'A-Za-z0-9._-' '.')"
            [[ "${n}" == "${f}" ]] || mv -- "${f}" "${n}"
          done
          sha256sum -- $(ls | grep -v '\.sha256$') > SHA256SUMS
          cd - > /dev/null
          tag="build-$(date -u +%Y%m%d-%H%M)"
          notes="${RUNNER_TEMP}/notes.md"
          {
            echo "Built from ${SHA}. Check the assets with \`sha256sum -c SHA256SUMS\`."
            echo
            if [[ -n "${DIGEST}" ]]; then
              echo "**Image:** \`${REF}\` = \`${DIGEST}\`, cosign-signed (\`cosign verify --key image/cosign.pub\`)."
              echo
              echo "**Installer ISO:** write it to a USB stick and boot it; read the on-screen notes, then run \`sudo scroll-secure-install\` (wipes the disk you pick). It pulls the image only if its cosign signature verifies against the key inside the ISO."
            else
              echo "No image or ISO in this build (no signing secrets)."
            fi
            echo
            echo "**RPMs:** \`scroll\` (our hardened fork) and \`scroll-secure-desktop\`, built with mock, reproducible: the image contains these exact files. Unsigned (rpm --checksig shows no signature); verify with SHA256SUMS."
            echo
            echo "**vmgui guest packages:** RPM/DEB per desktop (wlroots, xorg), win11 and macOS agents. See vmgui/README.md."
            echo
            echo "Not audited. Read the threat model first: https://wildcommitter.github.io/fedora-secureblue-tpm-fido2/threat-model.html"
          } > "${notes}"
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${SHA}" \
            --title "Build ${tag#build-}" --notes-file "${notes}" "${out}"/*
